name: Notify portfolio of Work Day with God release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Request portfolio release metadata sync
        env:
          PORTFOLIO_DISPATCH_TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if [ -z "$PORTFOLIO_DISPATCH_TOKEN" ]; then
            echo "PORTFOLIO_DISPATCH_TOKEN is not configured. Add it to enable immediate portfolio synchronization."
            echo "The portfolio's scheduled sync remains available as a fallback."
            exit 0
          fi
          curl --fail-with-body --request POST \
            --url https://api.github.com/repos/mcographics/mcographics.github.io/dispatches \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $PORTFOLIO_DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "User-Agent: WorkDaywithGod-release-notifier" \
            --data "{\"event_type\":\"work-day-with-god-release\",\"client_payload\":{\"tag\":\"$RELEASE_TAG\"}}"
